# SPDX-License-Identifier: GPL-2.0-or-later
#
# Daily preview build.
#
# Every night this builds the tip of `main`, runs the host suites as a gate, and
# publishes a prerelease tagged `preview-YYYY-MM-DD`: the two firmware payloads,
# their hashes and a README whose first paragraph says the code is preview,
# unproven and not installed anywhere.
#
# It is a preview, not a release:
#  - no device run is claimed and none is implied;
#  - the images are signed with a test key generated by this run;
#  - a red host suite publishes nothing.
#
# The build uses the distro ARM toolchain rather than the pinned Rockbox
# arm-elf-eabi 9.5.0 with -Wno-error, because a preview must not fail on a
# warning the toolchain of record does not emit. The pinned toolchain stays the
# build of record for anything that matters.

name: preview

on:
  schedule:
    # 04:17 UTC daily: after most days' merges, before a European morning.
    #
    # GitHub's scheduler is not a promise. Through November 2026 `schedule`
    # events have been dropped or arrive hours late across public repositories,
    # and this workflow's first two runs were manual for exactly that reason. So
    # a push to `main` also runs it: the `check` job skips the build when the
    # day's prerelease already exists, which makes the push a top-up rather than
    # a second build. One preview per calendar day, whichever trigger gets there
    # first.
    - cron: '17 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  check:
    name: is today's preview already out?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
    steps:
      - name: Look for the day's prerelease
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          skip=0
          tag="preview-$(date -u +%Y-%m-%d)"
          # `gh api` takes the repository explicitly because this job does not
          # check the repository out; `gh release view` would have no remote to
          # read it from.
          if [ "${{ github.event_name }}" = "push" ] &&
             gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already published; nothing to top up"
            skip=1
          else
            echo "$tag is missing; building it"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  host-tests:
    name: host suites (gate)
    needs: check
    if: needs.check.outputs.skip == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install clang, Pillow and mutagen
        # Pillow and mutagen build the HDB fixture that tests/musicdb and
        # tests/ui need; without them the gate fails on ubuntu before it ever
        # reaches the build. tests.yml installs the same pair.
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y clang python3-pil python3-mutagen

      - name: Run the host suites
        run: ./tools/host-tests.sh clang

  build:
    name: build the payload
    needs: host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM toolchain and the signing module
        # tools/make-firmware-image.py signs the manifest with Ed25519 from
        # `cryptography`; without it the build gets as far as signing and stops.
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y gcc-arm-none-eabi python3 \
            python3-cryptography

      - name: Build
        env:
          CROSS: arm-none-eabi-
          # A warning from a newer compiler must not fail a preview build; a
          # link, size or symbol failure still does.
          EXTRA_CFLAGS: -Wno-error
        run: ./tools/preview-build.sh dist/preview

      - name: Pack the artifact
        run: |
          date=$(date -u +%Y-%m-%d)
          tar -czf "dist/helikon-preview-${date}.tar.gz" -C dist/preview .
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: preview-payload
          path: dist/
          if-no-files-found: error

  release:
    name: publish the prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: preview-payload
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          date=$(date -u +%Y-%m-%d)
          tag="preview-${date}"
          archive="dist/helikon-preview-${date}.tar.gz"
          # A re-run on the same day replaces the day's release instead of
          # failing on an existing tag.
          gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$tag" \
              "$archive" \
              "dist/preview/README-PREVIEW.md" \
              "dist/preview/CHANGELOG.md" \
              --prerelease \
              --title "Preview build ${date}" \
              --notes-file dist/preview/README-PREVIEW.md
          echo "published $tag"
